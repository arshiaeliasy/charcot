<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پره انترنی | شارکوت</title>
    <style>
        :root { --bg-main: #07161B; --bg-card: #0E252D; --accent-teal: #2DD4BF; --text-main: #F0FDF4; --text-muted: #94A3B8; --border-color: #1E3A4C; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 18px 5%; border-bottom: 1px solid var(--border-color); background-color: rgba(7, 22, 27, 0.95); }
        .back-btn { color: var(--accent-teal); text-decoration: none; font-weight: bold; font-size: 0.9rem; border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 8px; }
        .content-container { max-width: 800px; margin: 80px auto; padding: 40px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; text-align: center; width: 90%; }
        h2 { color: var(--accent-teal); margin-bottom: 15px; font-size: 1.8rem; }
        p { color: var(--text-muted); font-size: 1.1rem; }
        footer { text-align: center; padding: 20px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
<body>
    <header>
        <h1>شارکوت | پره انترنی</h1>
        <a href="index.html" class="back-btn">← بازگشت به صفحه اصلی</a>
    </header>
    <main class="content-container">
        <h2>📝 پره انترنی</h2>
        <p>این بخش به زودی آپدیت می‌شود.</p>
    </main>
    <footer>Educate • Research • Inspire &copy; 2026 - شارکوت</footer>
</body>
</html>
